<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Human Mortality Visualization</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://d3js.org/topojson.v3.min.js"></script>
</head>
<body>
    <h1>Human Mortality Database </h1>
    
    <div id="controls">
        <label>Year: </label>
        <input type="range" id="year-slider" min="1960" max="2020" value="2000">
        <span id="year-display">2000</span>
    </div>
    
    <div id="map"></div>
    <div id="tooltip"></div>
    
    <script>
        const width = 960;
        const height = 500;


        const svg = d3.select("#map")
            .append("svg")
            .attr("width", width)
            .attr("height", height);

        const projection = d3.geoNaturalEarth1()
            .scale(170)
            .translate([width / 2, height / 2]);

        const path = d3.geoPath().projection(projection);
        
        d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json")
            .then(function(world) {
                const countries = topojson.feature(world, world.objects.countries);
                
                svg.selectAll("path")
                    .data(countries.features)
                    .enter()
                    .append("path")
                    .attr("d", path)
                    .attr("fill", "#ccc")
                    .attr("stroke", "#fff");
                
                console.log("Map loaded!");
            });
    </script>
</body>
</html>
