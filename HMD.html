<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Human Mortality Visualization</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://d3js.org/topojson.v3.min.js"></script>
</head>
<body>
    <h1>Human Mortality Database - Life Expectancy</h1>
    <label>Dataset: </label>
    <select id="dataset-select">
        <option value="E0coh.txt">Life Expectancy</option>
        <option value="Deaths_1x1.txt">Deaths</option>
        <option value="Population.txt">Population</option>
    </select>
    
    <div id="controls">
        <label>Year: </label>
        <input type="range" id="year-slider" min="1960" max="2020" value="2000">
        <span id="year-display">2000</span>
    </div>
    
    <div id="map"></div>
    <div id="tooltip"></div>
    <div id="chart"></div>
    
    <script>
        const width = 960;
        const height = 500;
        const chartWidth = 600;
        const chartHeight = 300;
        const chartMargin = {top: 20, right: 30, bottom: 30, left: 50};

        const hmdToCountry = {
            'AUS': 'Australia',
            'AUT': 'Austria',
            'BEL': 'Belgium',
            'BGR': 'Bulgaria',
            'BLR': 'Belarus',
            'CAN': 'Canada',
            'CHE': 'Switzerland',
            'CHL': 'Chile',
            'CZE': 'Czechia',
            'DEUTNP': 'Germany',
            'DNK': 'Denmark',
            'ESP': 'Spain',
            'EST': 'Estonia',
            'FIN': 'Finland',
            'FRATNP': 'France',
            'GBR_NP': 'United Kingdom',
            'GRC': 'Greece',
            'HKG': 'Hong Kong',
            'HRV': 'Croatia',
            'HUN': 'Hungary',
            'IRL': 'Ireland',
            'ISL': 'Iceland',
            'ISR': 'Israel',
            'ITA': 'Italy',
            'JPN': 'Japan',
            'KOR': 'South Korea',
            'LTU': 'Lithuania',
            'LUX': 'Luxembourg',
            'LVA': 'Latvia',
            'NLD': 'Netherlands',
            'NOR': 'Norway',
            'NZL_NP': 'New Zealand',
            'POL': 'Poland',
            'PRT': 'Portugal',
            'RUS': 'Russia',
            'SVK': 'Slovakia',
            'SVN': 'Slovenia',
            'SWE': 'Sweden',
            'TWN': 'Taiwan',
            'UKR': 'Ukraine',
            'USA': 'United States of America'
        };

        const countryToHmd = {};
        for (const [hmd, country] of Object.entries(hmdToCountry)) {
            countryToHmd[country] = hmd;
        }

        let mortalityData = {};
        let currentYear = 2000;
        let currentDataset = "E0coh.txt";

        const datasetConfig = {
            "E0coh.txt": {
                label: "Life Expectancy",
                unit: "years",
                hasAge: false,
                colorDomain: [50, 90]
            },
            "Deaths_1x1.txt": {
                label: "Deaths",
                unit: "",
                hasAge: true,
                colorDomain: [0, 500000]
            },
            "Population.txt": {
                label: "Population",
                unit: "",
                hasAge: true,
                colorDomain: [0, 50000000]
            }
        };

        const colorScale = d3.scaleSequential(d3.interpolateRdYlGn)
            .domain([50, 90]);

        const tooltip = d3.select("#tooltip")
            .style("position", "absolute")
            .style("background", "white")
            .style("border", "1px solid #333")
            .style("padding", "8px")
            .style("display", "none");

        const svg = d3.select("#map")
            .append("svg")
            .attr("width", width)
            .attr("height", height);

        const chartSvg = d3.select("#chart")
            .append("svg")
            .attr("width", chartWidth)
            .attr("height", chartHeight);

        const projection = d3.geoNaturalEarth1()
            .scale(170)
            .translate([width / 2, height / 2]);
        
        const chartG = chartSvg.append("g")
            .attr("transform", "translate(" + chartMargin.left + "," + chartMargin.top + ")");

        const xScale = d3.scaleLinear()
            .range([0, chartWidth - chartMargin.left - chartMargin.right]);

        const yScale = d3.scaleLinear()
            .range([chartHeight - chartMargin.top - chartMargin.bottom, 0]);
        
        chartG.append("g")
            .attr("class", "x-axis")
            .attr("transform", "translate(0," + (chartHeight - chartMargin.top - chartMargin.bottom) + ")");

        chartG.append("g")
            .attr("class", "y-axis");

        const line = d3.line()
            .x(function(d) { return xScale(d.year); })
            .y(function(d) { return yScale(d.value); });
        
        const path = d3.geoPath().projection(projection);

        let selectedCountries = [];

        function updateChart() {
            const years = Object.keys(mortalityData).map(d => +d).sort((a,b) => a-b);
            xScale.domain([d3.min(years), d3.max(years)]);
            let allValues = [];
            selectedCountries.forEach(function(hmdCode) {
                years.forEach(function(year) {
                    if (mortalityData[year] && mortalityData[year][hmdCode]) {
                        allValues.push(mortalityData[year][hmdCode]);
                    }
                });
            });

            if (allValues.length > 0) {
                yScale.domain([d3.min(allValues) - 5, d3.max(allValues) + 5]);
            } else {
                yScale.domain([40, 95]);
            }

            chartG.select(".x-axis").call(d3.axisBottom(xScale).tickFormat(d3.format("d")));
            chartG.select(".y-axis").call(d3.axisLeft(yScale));

            const lineData = selectedCountries.map(function(hmdCode) {
                const values = years.map(function(year) {
                    return {
                        year: year,
                        value: mortalityData[year] ? mortalityData[year][hmdCode] : null
                    };
                }).filter(function(d) { return d.value !== null && d.value !== undefined; });
                
                return {code: hmdCode, values: values};
            });

            const lines = chartG.selectAll(".line")
                .data(lineData, function(d) { return d.code; });

            lines.enter()
                .append("path")
                .attr("class", "line")
                .attr("fill", "none")
                .attr("stroke-width", 2)
                .merge(lines)
                .attr("stroke", function(d) { 
                    const latestYear = d.values[d.values.length - 1];
                    return colorScale(latestYear ? latestYear.value : 70);
                })
                .attr("d", function(d) { return line(d.values); });

            lines.exit().remove();
        }

        d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json")
            .then(function(world) {
                const countries = topojson.feature(world, world.objects.countries);
                
            svg.selectAll("path")
                .data(countries.features)
                .enter()
                .append("path")
                .attr("d", path)
                .attr("fill", "#ccc")
                .attr("stroke", "#fff")
                .on("mouseover", handleMouseOver)
                .on("mousemove", handleMouseMove)
                .on("mouseout", handleMouseOut)
                .on("click", handleClick)
                
                console.log("Map loaded!");
                
                loadData(currentDataset);
            });

        function loadData(filename) {
            selectedCountries = [];
            const config = datasetConfig[filename];
            
            if (!config) {
                console.error("No config for:", filename);
                return;
            }
            
            d3.text(filename).then(function(text) {
                mortalityData = {};
                const lines = text.trim().split("\n");
                
                if (config.hasAge) {
                    for (let i = 1; i < lines.length; i++) {
                        const parts = lines[i].trim().split(/\s+/);
                        const popName = parts[0];
                        const year = +parts[1];
                        const total = +parts[5];
                        
                        if (hmdToCountry[popName] && !isNaN(total)) {
                            if (!mortalityData[year]) mortalityData[year] = {};
                            if (!mortalityData[year][popName]) mortalityData[year][popName] = 0;
                            mortalityData[year][popName] += total;
                        }
                    }
                } else {
                    for (let i = 1; i < lines.length; i++) {
                        const parts = lines[i].trim().split(/\s+/);
                        const popName = parts[0];
                        const year = +parts[1];
                        const total = +parts[4];
                        
                        if (hmdToCountry[popName] && !isNaN(total)) {
                            if (!mortalityData[year]) mortalityData[year] = {};
                            mortalityData[year][popName] = total;
                        }
                    }
                }
                colorScale.domain(config.colorDomain);
                updateMap();
                updateChart();
            });
        }

        function updateMap() {
            svg.selectAll("path")
                .attr("fill", function(d) {
                    const countryName = d.properties.name;
                    const hmdCode = countryToHmd[countryName];
                    
                    if (hmdCode && mortalityData[currentYear] && mortalityData[currentYear][hmdCode]) {
                        return colorScale(mortalityData[currentYear][hmdCode]);
                    }
                    return "#ccc";
                });
        }

        function handleMouseOver(event, d) {
            const countryName = d.properties.name;
            const hmdCode = countryToHmd[countryName];
            
            if (hmdCode && mortalityData[currentYear] && mortalityData[currentYear][hmdCode]) {
                const value = mortalityData[currentYear][hmdCode];
                
                tooltip
                    .style("display", "block")
                    .html("<strong>" + countryName + "</strong><br>Life Expectancy: " + value.toFixed(2) + " years<br>Year: " + currentYear + "<br><em>Click to add to chart</em>");
                
                d3.select(this).attr("stroke", "#000").attr("stroke-width", 1);
            }
        }

        function handleMouseMove(event) {
            tooltip
                .style("left", (event.pageX + 10) + "px")
                .style("top", (event.pageY - 28) + "px");
        }

        function handleMouseOut() {
            tooltip.style("display", "none");
            d3.select(this).attr("stroke", "#fff").attr("stroke-width", 1);
        }

        function handleClick(event, d) {
            const countryName = d.properties.name;
            const hmdCode = countryToHmd[countryName];
            
            if (hmdCode && mortalityData[currentYear] && mortalityData[currentYear][hmdCode]) {
                const index = selectedCountries.indexOf(hmdCode);
                if (index > -1) {
                    selectedCountries.splice(index, 1); 
                } else {
                    selectedCountries.push(hmdCode); 
                }
                console.log("Selected:", selectedCountries);
                updateChart();
            }
        }

        d3.select("#year-slider").on("input", function() {
            currentYear = +this.value;
            d3.select("#year-display").text(currentYear);
            updateMap();
        });

        d3.select("#dataset-select").on("change", function() {
            currentDataset = this.value;
            loadData(currentDataset);
        });
    </script>
</body>
</html>
