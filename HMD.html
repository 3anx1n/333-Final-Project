<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Human Mortality Visualization</title>
<style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            margin: 15px;
            max-width: 100%;
        }
        h1 {
            color: #333;
            border-bottom: 2px solid #4CAF50;
            padding-bottom: 10px;
            margin-top: 0;
            font-size: 24px;
        }
        h3 {
            color: #555;
            font-size: 14px;
            margin: 0 0 5px 0;
        }
        #line-title {
            margin-bottom: 30px;
        }
        button {
            padding: 3px 8px;
            cursor: pointer;
            border: 1px solid #ccc;
            border-radius: 3px;
            background: #fff;
            font-size: 12px;
        }
        button:hover {
            background: #f0f0f0;
        }
        select {
            padding: 3px;
            border-radius: 3px;
            font-size: 12px;
        }
        label {
            font-size: 13px;
        }
        #controls-panel {
            margin-bottom: 10px;
            padding: 8px;
            background: #f5f5f5;
            border-radius: 5px;
        }
        #year-controls {
            margin-bottom: 10px;
            padding: 8px;
            background: #e8f4f8;
            border-radius: 5px;
        }
        #main-container {
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }
        #left-panel {
            width: 900px;
            flex-shrink: 0;
        }
        #middle-panel {
            width: 250px;
            flex-shrink: 0;
        }
        #right-panel {
            width: 900px;
            flex-shrink: 0;
        }
        #map {
            background: #f0f8ff;
            border: 1px solid #ccc;
            width: 100%;
        }
        #bar-chart {
            margin-top: 8px;
            max-height: 650px;
            overflow-y: auto;
            border: 1px solid #eee;
        }
        #line-panel {
            margin-top: 15px;
        }
        #chart {
            background: #fafafa;
            border: 1px solid #ccc;
        }
        #zoom-controls {
            margin-bottom: 5px;
        }
        #zoom-controls button {
            padding: 2px 8px;
        }
        #legend {
            margin-top: 5px;
        }
        .axis text {
            font-size: 10px;
        }
        .axis-label {
            font-size: 11px;
            font-weight: bold;
        }
    </style>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://d3js.org/topojson.v3.min.js"></script>
</head>
<body>
    <h1>Human Mortality Database Visualization</h1>
    
    <div id="controls-panel" style="margin-bottom: 15px; padding: 10px; background: #f5f5f5; border-radius: 5px;">
        <label><strong>Dataset:</strong></label>
        <select id="dataset-select">
            <option value="E0coh.txt">Life Expectancy</option>
            <option value="Deaths_1x1.txt">Deaths</option>
            <option value="Population.txt">Population</option>
            <option value="DeathRate">Death Rate (per 1,000)</option>
        </select>

        <label style="margin-left: 20px;"><strong>Gender:</strong></label>
        <select id="gender-select">
            <option value="Total">Total</option>
            <option value="Female">Female</option>
            <option value="Male">Male</option>
        </select>

        <label style="margin-left: 20px;"><strong>Age:</strong></label>
        <input type="range" id="age-slider" min="0" max="100" value="0" disabled>
        <span id="age-display">All Ages</span>
        <label style="margin-left: 10px;">
            <input type="checkbox" id="age-toggle"> Filter by age
        </label>
    </div>

    <div id="year-controls" style="margin-bottom: 15px; padding: 10px; background: #e8f4f8; border-radius: 5px;">
        <label><strong>Year:</strong></label>
        <input type="range" id="year-slider" min="1960" max="2020" value="2000" style="width: 300px;">
        <span id="year-display" style="font-size: 18px; font-weight: bold; margin-left: 10px;">2000</span>
        <button id="play-btn" style="margin-left: 20px;">▶ Play</button>
        <button id="reset-btn" style="margin-left: 10px;">Reset Selection</button>
    </div>
    
    <div id="main-container" style="display: flex; gap: 15px; align-items: flex-start;">
            <div id="left-panel">
                <h3 id="map-title">World Map - Life Expectancy (2000)</h3>
                <div id="zoom-controls">
                    <button id="zoom-in">+</button>
                    <button id="zoom-out">−</button>
                    <button id="zoom-reset">Reset Zoom</button>
                </div>
                <div id="map"></div>
                <div id="legend"></div>
            </div>
            <div id="middle-panel">
                <h3 id="bar-title">Country Rankings</h3>
                <label>Show: </label>
                <select id="bar-filter">
                    <option value="top10">Top 10</option>
                    <option value="bottom10">Bottom 10</option>
                    <option value="all">All Countries</option>
                    <option value="selected">Selected Only</option>
                </select>
                <div id="bar-chart"></div>
            </div>
            <div id="right-panel">
                <h3 id="line-title">Trend Comparison</h3>
                <div id="chart"></div>
            </div>
        </div>
        <div id="tooltip"></div>
        <div id="chart" style="border: 1px solid #ccc;"></div>
    </div>
    <script>
        const width = 900;
        const height = 650;
        const chartWidth = 900;
        const chartHeight = 650;
        const chartMargin = {top: 20, right: 150, bottom: 50, left: 70};

        const hmdToCountry = {
            'AUS': 'Australia',
            'AUT': 'Austria',
            'BEL': 'Belgium',
            'BGR': 'Bulgaria',
            'BLR': 'Belarus',
            'CAN': 'Canada',
            'CHE': 'Switzerland',
            'CHL': 'Chile',
            'CZE': 'Czechia',
            'DEUTNP': 'Germany',
            'DNK': 'Denmark',
            'ESP': 'Spain',
            'EST': 'Estonia',
            'FIN': 'Finland',
            'FRATNP': 'France',
            'GBR_NP': 'United Kingdom',
            'GRC': 'Greece',
            'HKG': 'Hong Kong',
            'HRV': 'Croatia',
            'HUN': 'Hungary',
            'IRL': 'Ireland',
            'ISL': 'Iceland',
            'ISR': 'Israel',
            'ITA': 'Italy',
            'JPN': 'Japan',
            'KOR': 'South Korea',
            'LTU': 'Lithuania',
            'LUX': 'Luxembourg',
            'LVA': 'Latvia',
            'NLD': 'Netherlands',
            'NOR': 'Norway',
            'NZL_NP': 'New Zealand',
            'POL': 'Poland',
            'PRT': 'Portugal',
            'RUS': 'Russia',
            'SVK': 'Slovakia',
            'SVN': 'Slovenia',
            'SWE': 'Sweden',
            'TWN': 'Taiwan',
            'UKR': 'Ukraine',
            'USA': 'United States of America'
        };

        const countryToHmd = {};
        for (const [hmd, country] of Object.entries(hmdToCountry)) {
            countryToHmd[country] = hmd;
        }

        let mortalityData = {};
        let currentYear = 2000;
        let currentDataset = "E0coh.txt";
        let currentGender = "Total";
        let currentAge = "all";
        let ageFilterEnabled = false;

        const datasetConfig = {
            "E0coh.txt": {
                label: "Life Expectancy",
                unit: "years",
                hasAge: false,
                colorDomain: [50, 90],
                colorScheme: d3.interpolateRdYlGn
            },
            "Deaths_1x1.txt": {
                label: "Deaths",
                unit: "",
                hasAge: true,
                colorDomain: [0, 500000],
                colorScheme: d3.interpolateOrRd
            },
            "Population.txt": {
                label: "Population",
                unit: "",
                hasAge: true,
                colorDomain: [0, 50000000],
                colorScheme: d3.interpolateBlues
            },
            "DeathRate": {
                label: "Death Rate",
                unit: "per 1,000",
                hasAge: true,
                colorDomain: [5, 25],
                colorScheme: d3.interpolateOranges,
                needsBoth: true
            }
        };

        let colorScale = d3.scaleSequential(d3.interpolateRdYlGn)
            .domain([50, 90]);

        const tooltip = d3.select("#tooltip")
            .style("position", "absolute")
            .style("background", "white")
            .style("border", "1px solid #333")
            .style("padding", "8px")
            .style("display", "none");

        const svg = d3.select("#map")
            .append("svg")
            .attr("width", width)
            .attr("height", height);

        const mapG = svg.append("g");
        const zoom = d3.zoom()
            .scaleExtent([1, 8])
            .on("zoom", function(event) {
                mapG.attr("transform", event.transform);
            });

        svg.call(zoom);

        const chartSvg = d3.select("#chart")
            .append("svg")
            .attr("width", chartWidth)
            .attr("height", chartHeight);

        const barWidth = 180;
        const barHeight = 600;
        const barMargin = {top: 10, right: 35, bottom: 20, left: 120};

        const barSvg = d3.select("#bar-chart")
            .append("svg")
            .attr("width", barWidth)
            .attr("height", barHeight);

        const barG = barSvg.append("g")
            .attr("transform", "translate(" + barMargin.left + "," + barMargin.top + ")");

        const barXScale = d3.scaleLinear()
            .range([0, barWidth - barMargin.left - barMargin.right]);

        const barYScale = d3.scaleBand()
            .range([0, barHeight - barMargin.top - barMargin.bottom])
            .padding(0.1);

        let barFilter = "top10";
        const projection = d3.geoNaturalEarth1()
            .scale(170)
            .translate([width / 2, height / 2]);
        
        const chartG = chartSvg.append("g")
            .attr("transform", "translate(" + chartMargin.left + "," + chartMargin.top + ")");

        const xScale = d3.scaleLinear()
            .range([0, chartWidth - chartMargin.left - chartMargin.right]);

        const yScale = d3.scaleLinear()
            .range([chartHeight - chartMargin.top - chartMargin.bottom, 0]);
        
        chartG.append("g")
            .attr("class", "x-axis")
            .attr("transform", "translate(0," + (chartHeight - chartMargin.top - chartMargin.bottom) + ")");

        chartG.append("g")
            .attr("class", "y-axis");

        const line = d3.line()
            .defined(function(d) { return d.value !== null && !isNaN(d.value) && isFinite(d.value); })
            .x(function(d) { return xScale(d.year); })
            .y(function(d) { return yScale(d.value); });
        
        const path = d3.geoPath().projection(projection);

        let selectedCountries = [];
        let isPlaying = false;
        let playInterval = null;
        let hoveredCountry = null;       
        function updateChart() {
            const years = Object.keys(mortalityData).map(d => +d).sort((a,b) => a-b);

            let minYear = Infinity;
            let maxYear = -Infinity;
            let allValues = [];
            
            selectedCountries.forEach(function(hmdCode) {
                let countryValues = [];
                years.forEach(function(year) {
                    if (mortalityData[year] && mortalityData[year][hmdCode]) {
                        countryValues.push(mortalityData[year][hmdCode]);
                        if (year < minYear) minYear = year;
                        if (year > maxYear) maxYear = year;
                    }
                });

                if (countryValues.length > 0) {
                    countryValues.sort((a, b) => a - b);
                    const median = countryValues[Math.floor(countryValues.length / 2)];
                    
                    countryValues.forEach(function(v) {
                        if (v < median * 3) {
                            allValues.push(v);
                        }
                    });
                }
            });

            const lineData = selectedCountries.map(function(hmdCode) {
                const values = [];
                years.forEach(function(year) {
                    if (mortalityData[year] && mortalityData[year][hmdCode]) {
                        const val = mortalityData[year][hmdCode];
                        if (val !== null && val !== undefined && !isNaN(val) && isFinite(val) && val > 0) {
                            values.push({year: year, value: val});
                        }
                    }
                });
                return {code: hmdCode, values: values};
            });
            if (allValues.length > 0) {
                xScale.domain([minYear, maxYear]);
                
                const sortedValues = allValues.slice().sort((a, b) => a - b);
                const yMin = sortedValues[0];
                const yMax = sortedValues[sortedValues.length - 1];

                console.log("Y values range:", yMin, "-", yMax);
                
                const padding = (yMax - yMin) * 0.1;
                yScale.domain([Math.max(0, yMin - padding), yMax + padding]);
            } else {
                xScale.domain([1960, 2020]);
                yScale.domain([40, 95]);
            }
            const yAxisFormat = function(d) {
                if (d >= 1000000) return (d / 1000000).toFixed(1) + "M";
                if (d >= 1000) return (d / 1000).toFixed(0) + "K";
                return d;
            };

            chartG.select(".x-axis").call(d3.axisBottom(xScale).tickFormat(d3.format("d")));
            chartG.select(".y-axis").call(d3.axisLeft(yScale).tickFormat(yAxisFormat));

            chartG.selectAll(".x-axis-label").remove();
            chartG.selectAll(".y-axis-label").remove();
            
            chartG.append("text")
                .attr("class", "x-axis-label")
                .attr("x", (chartWidth - chartMargin.left - chartMargin.right) / 2)
                .attr("y", chartHeight - chartMargin.top)
                .attr("text-anchor", "middle")
                .attr("font-size", "12px")
                .attr("font-weight", "bold")
                .text("Year");

            const config = datasetConfig[currentDataset];
            let yLabel = config.label;
            if (config.unit) {
                yLabel += " (" + config.unit + ")";
            }
            
            chartG.append("text")
                .attr("class", "y-axis-label")
                .attr("transform", "rotate(-90)")
                .attr("x", -(chartHeight - chartMargin.top - chartMargin.bottom) / 2)
                .attr("y", -50)
                .attr("text-anchor", "middle")
                .attr("font-size", "12px")
                .attr("font-weight", "bold")
                .text(yLabel);

            const lines = chartG.selectAll(".line")
                .data(lineData, function(d) { return d.code; });

            const lineColors = ["#e41a1c", "#377eb8", "#4daf4a", "#984ea3", "#ff7f00", "#a65628", "#f781bf", "#999999"];

            lines.enter()
                .append("path")
                .attr("class", "line")
                .attr("fill", "none")
                .attr("stroke-width", 1)
                .merge(lines)
                .attr("stroke", function(d) { 
                    const colorIndex = selectedCountries.indexOf(d.code);
                    return lineColors[colorIndex % lineColors.length];
                })
                .attr("d", function(d) { 
                    const xDomain = xScale.domain();
                    const filteredValues = d.values.filter(function(v) {
                        return v.year >= xDomain[0] && v.year <= xDomain[1] && 
                            v.value !== null && !isNaN(v.value) && isFinite(v.value);
                    });
                    return filteredValues.length > 1 ? line(filteredValues) : null;
                });

            lines.exit().remove();

            chartG.selectAll(".line-dot").remove();
            lineData.forEach(function(d) {
                const xDomain = xScale.domain();
                const filteredValues = d.values.filter(function(v) {
                    return v.year >= xDomain[0] && v.year <= xDomain[1];
                });
                
                chartG.selectAll(".line-dot-" + d.code)
                    .data(filteredValues)
                    .enter()
                    .append("circle")
                    .attr("class", "line-dot")
                    .attr("cx", function(v) { return xScale(v.year); })
                    .attr("cy", function(v) { return yScale(v.value); })
                    .attr("r", 4)
                    .attr("fill", function() {
                        const lineColors = ["#e41a1c", "#377eb8", "#4daf4a", "#984ea3", "#ff7f00", "#a65628", "#f781bf", "#999999"];
                        const colorIndex = selectedCountries.indexOf(d.code);
                        return lineColors[colorIndex % lineColors.length];
                    })
                    .attr("opacity", 0)
                    .on("mouseover", function(event, v) {
                        d3.select(this).attr("opacity", 1).attr("r", 6);
                        
                        const config = datasetConfig[currentDataset];
                        let displayValue;
                        if (v.value >= 1000000) {
                            displayValue = (v.value / 1000000).toFixed(2) + " million";
                        } else if (v.value >= 1000) {
                            displayValue = (v.value / 1000).toFixed(1) + " thousand";
                        } else {
                            displayValue = v.value.toFixed(2);
                        }
                        
                        tooltip
                            .style("display", "block")
                            .html("<strong>" + hmdToCountry[d.code] + "</strong><br>" +
                                  config.label + ": " + displayValue + " " + config.unit + "<br>" +
                                  "Year: " + v.year);
                    })
                    .on("mousemove", function(event) {
                        tooltip
                            .style("left", (event.pageX + 10) + "px")
                            .style("top", (event.pageY - 28) + "px");
                    })
                    .on("mouseout", function() {
                        d3.select(this).attr("opacity", 0).attr("r", 4);
                        tooltip.style("display", "none");
                    });
            });

            chartG.selectAll(".line-label").remove();
            const chartInnerWidth = chartWidth - chartMargin.left - chartMargin.right;

            lineData.forEach(function(d) {
                if (d.values.length > 0) {
                    const xDomain = xScale.domain();
                    let lastVisiblePoint = null;
                    
                    for (let i = d.values.length - 1; i >= 0; i--) {
                        if (d.values[i].year >= xDomain[0] && d.values[i].year <= xDomain[1]) {
                            lastVisiblePoint = d.values[i];
                            break;
                        }
                    }
                    
                    if (lastVisiblePoint) {
                        const labelValue = lastVisiblePoint.value;
                        const labelYear = lastVisiblePoint.year;
                        
                        if (labelValue !== null && !isNaN(labelValue)) {
                            const lineColors = ["#e41a1c", "#377eb8", "#4daf4a", "#984ea3", "#ff7f00", "#a65628", "#f781bf", "#999999"];
                            const colorIndex = selectedCountries.indexOf(d.code);

                            chartG.append("text")
                                .attr("class", "line-label")
                                .attr("x", chartInnerWidth + 5)
                                .attr("y", yScale(labelValue))
                                .attr("fill", lineColors[colorIndex % lineColors.length])
                                .attr("font-size", "11px")
                                .attr("dominant-baseline", "middle")
                                .text(hmdToCountry[d.code]);
                        }
                    }
                }
            });
        }

        d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json")
            .then(function(world) {
                const countries = topojson.feature(world, world.objects.countries);
                
            mapG.selectAll("path")
                .data(countries.features)
                .enter()
                .append("path")
                .attr("d", path)
                .attr("fill", "#ccc")
                .attr("stroke", "#fff")
                .on("mouseover", handleMouseOver)
                .on("mousemove", handleMouseMove)
                .on("mouseout", handleMouseOut)
                .on("click", handleClick)
                
                console.log("Map loaded!");
                
                loadData(currentDataset);
            });

        function loadData(filename) {
            selectedCountries = [];
            const config = datasetConfig[filename];
            
            if (!config) {
                console.error("No config for:", filename);
                return;
            }
            
            if (config.needsBoth) {
                Promise.all([
                    d3.text("Deaths_1x1.txt"),
                    d3.text("Population.txt")
                ]).then(function([deathsText, popText]) {
                    const deathsRaw = parseAgeData(deathsText);
                    const popRaw = parseAgeData(popText);
                    
                    mortalityData = {};
                    for (const year in deathsRaw) {
                        mortalityData[year] = {};
                        for (const country in deathsRaw[year]) {
                            const deaths = deathsRaw[year][country][currentGender];
                            const pop = popRaw[year] && popRaw[year][country] ? popRaw[year][country][currentGender] : 0;
                            if (pop > 0) {
                                mortalityData[year][country] = (deaths / pop) * 1000;
                            }
                        }
                    }
                    
                    colorScale = d3.scaleSequential(config.colorScheme).domain(config.colorDomain);
                    updateMap();
                    updateChart();
                    updateLegend();
                    updateBarChart();
                    updateTitles();
                });
            } else if (config.hasAge) {
                    d3.text(filename).then(function(text) {
                        const rawData = parseAgeData(text);
                        mortalityData = {};
                        for (const year in rawData) {
                            mortalityData[year] = {};
                            for (const country in rawData[year]) {
                                mortalityData[year][country] = rawData[year][country][currentGender];
                            }
                        }
                        colorScale = d3.scaleSequential(config.colorScheme).domain(config.colorDomain);
                        updateMap();
                        updateChart();
                        updateLegend();
                        updateBarChart();
                        updateTitles();
                    });
            } else {
                d3.text(filename).then(function(text) {
                    mortalityData = {};
                    const lines = text.trim().split("\n");
                    
                    for (let i = 1; i < lines.length; i++) {
                        const parts = lines[i].trim().split(/\s+/);
                        const popName = parts[0];
                        const year = +parts[1].replace(/[+-]/g, '');
                        const female = +parts[2];
                        const male = +parts[3];
                        const total = +parts[4];
                        
                        if (hmdToCountry[popName] && !isNaN(year)) {
                            if (!mortalityData[year]) mortalityData[year] = {};
                            if (currentGender === "Female") {
                                mortalityData[year][popName] = female;
                            } else if (currentGender === "Male") {
                                mortalityData[year][popName] = male;
                            } else {
                                mortalityData[year][popName] = total;
                            }
                        }
                    }
                    
                    colorScale = d3.scaleSequential(config.colorScheme).domain(config.colorDomain);
                    updateMap();
                    updateChart();
                    updateLegend();
                    updateBarChart();
                    updateTitles();
                });
            }

            const ageSlider = document.getElementById("age-slider");
            const ageToggle = document.getElementById("age-toggle");
            const ageDisplay = document.getElementById("age-display");

            if (filename === "E0coh.txt") {
                ageSlider.disabled = true;
                ageToggle.disabled = true;
                ageToggle.checked = false;
                ageFilterEnabled = false;
                currentAge = "all";
                ageDisplay.textContent = "All Ages";
            } else {
                ageToggle.disabled = false;
                if (ageFilterEnabled) {
                    ageSlider.disabled = false;
                    ageDisplay.textContent = "Age " + currentAge;
                } else {
                    ageSlider.disabled = true;
                    ageDisplay.textContent = "All Ages";
                }
            }
        }

        

        function parseAgeData(text) {
            const data = {};
            const lines = text.trim().split("\n");
            
            for (let i = 1; i < lines.length; i++) {
                const parts = lines[i].trim().split(/\s+/);
                const popName = parts[0];
                const yearStr = parts[1];               
                if (yearStr.includes('+')) continue;                
                const year = +yearStr.replace('-', '');
                const ageStr = parts[2];
                const age = ageStr === "110+" ? 110 : +ageStr;
                
                if (ageFilterEnabled && currentAge !== "all") {
                    const targetAge = +currentAge;
                    if (age !== targetAge) continue;
                }
                
                const female = +parts[3];
                const male = +parts[4];
                const total = +parts[5];
                
                if (hmdToCountry[popName] && !isNaN(year)) {
                    if (!data[year]) data[year] = {};
                    if (!data[year][popName]) {
                        data[year][popName] = {Female: 0, Male: 0, Total: 0};
                    }
                    if (!isNaN(female)) data[year][popName].Female += female;
                    if (!isNaN(male)) data[year][popName].Male += male;
                    if (!isNaN(total)) data[year][popName].Total += total;
                }
            }
            return data;
        }

        function updateMap() {
            mapG.selectAll("path")
                .attr("fill", function(d) {
                    const countryName = d.properties.name;
                    const hmdCode = countryToHmd[countryName];
                    
                    if (hmdCode && mortalityData[currentYear] && mortalityData[currentYear][hmdCode]) {
                        return colorScale(mortalityData[currentYear][hmdCode]);
                    }
                    return "#ccc";
                });
        }
        function updateLegend() {
            const config = datasetConfig[currentDataset];
            d3.select("#legend").html("");
            
            const legendWidth = 200;
            const legendHeight = 20;
            
            const legendSvg = d3.select("#legend")
                .append("svg")
                .attr("width", legendWidth + 50)
                .attr("height", legendHeight + 45);
            
            const defs = legendSvg.append("defs");
            const gradient = defs.append("linearGradient")
                .attr("id", "legend-gradient");
            
            for (let i = 0; i <= 10; i++) {
                const t = i / 10;
                const value = config.colorDomain[0] + t * (config.colorDomain[1] - config.colorDomain[0]);
                gradient.append("stop")
                    .attr("offset", (t * 100) + "%")
                    .attr("stop-color", colorScale(value));
            }

            legendSvg.append("text")
                .attr("x", 40)
                .attr("y", -5)
                .attr("font-size", "12px")
                .attr("font-weight", "bold")
                .text(config.label + (config.unit ? " (" + config.unit + ")" : ""));      

            legendSvg.append("rect")
                .attr("x", 40)
                .attr("y", 15)
                .attr("width", legendWidth)
                .attr("height", legendHeight)
                .style("fill", "url(#legend-gradient)");

            const legendScale = d3.scaleLinear()
                .domain(config.colorDomain)
                .range([0, legendWidth]);
            
            const legendAxis = d3.axisBottom(legendScale)
                .ticks(5)
                .tickFormat(function(d) {
                    if (d >= 1000000) return (d / 1000000).toFixed(0) + "M";
                    if (d >= 1000) return (d / 1000).toFixed(0) + "K";
                    return d;
                });
            
            legendSvg.append("g")
                .attr("transform", "translate(40, " + (15 + legendHeight) + ")")
                .call(legendAxis);
        }

        function updateBarChart() {
            const config = datasetConfig[currentDataset];
            let countries = [];
            if (mortalityData[currentYear]) {
                for (const code in mortalityData[currentYear]) {
                    const value = mortalityData[currentYear][code];
                    if (value && !isNaN(value) && isFinite(value) && hmdToCountry[code]) {
                        countries.push({code: code, name: hmdToCountry[code], value: value});
                    }
                }
            }
            
            countries.sort((a, b) => b.value - a.value);
            
            let filtered;
            if (barFilter === "top10") {
                filtered = countries.slice(0, 10);
            } else if (barFilter === "bottom10") {
                filtered = countries.slice(-10).reverse();
            } else if (barFilter === "selected") {
                filtered = countries.filter(c => selectedCountries.includes(c.code));
            } else {
                filtered = countries;
            }
            
            if (filtered.length > 0) {
                barXScale.domain([0, d3.max(filtered, d => d.value)]);
                barYScale.domain(filtered.map(d => d.name));
            }
            
            const dynamicHeight = Math.max(200, filtered.length * 25 + barMargin.top + barMargin.bottom);
            barSvg.attr("height", dynamicHeight);
            barYScale.range([0, dynamicHeight - barMargin.top - barMargin.bottom]);
            
            barG.selectAll("*").remove();
            
            barG.selectAll(".bar")
                .data(filtered, d => d.code)
                .enter()
                .append("rect")
                .attr("class", "bar")
                .attr("x", 0)
                .attr("y", d => barYScale(d.name))
                .attr("width", d => barXScale(d.value))
                .attr("height", barYScale.bandwidth())
                .attr("fill", d => colorScale(d.value))
                .attr("stroke", d => selectedCountries.includes(d.code) ? "#000" : "none")
                .attr("stroke-width", 1)
                .attr("cursor", "pointer")
                .on("click", function(event, d) {
                    const index = selectedCountries.indexOf(d.code);
                    if (index > -1) {
                        selectedCountries.splice(index, 1);
                    } else {
                        selectedCountries.push(d.code);
                    }
                    updateChart();
                    updateBarChart();
                })
                .on("mouseover", function(event, d) {
                    let displayValue;
                    if (d.value >= 1000000) {
                        displayValue = (d.value / 1000000).toFixed(2) + " million";
                    } else if (d.value >= 1000) {
                        displayValue = (d.value / 1000).toFixed(1) + " thousand";
                    } else {
                        displayValue = d.value.toFixed(2);
                    }
                    
                    tooltip
                        .style("display", "block")
                        .html("<strong>" + d.name + "</strong><br>" +
                              config.label + ": " + displayValue + " " + config.unit + "<br>" +
                              "<em>Click to add/remove from chart</em>");
                })
                .on("mousemove", function(event) {
                    tooltip
                        .style("left", (event.pageX + 10) + "px")
                        .style("top", (event.pageY - 28) + "px");
                })
                .on("mouseout", function() {
                    tooltip.style("display", "none");
                });
            
            barG.selectAll(".bar-label")
                .data(filtered, d => d.code)
                .enter()
                .append("text")
                .attr("class", "bar-label")
                .attr("x", -5)
                .attr("y", d => barYScale(d.name) + barYScale.bandwidth() / 2)
                .attr("text-anchor", "end")
                .attr("dominant-baseline", "middle")
                .attr("font-size", "10px")
                .attr("fill", d => selectedCountries.includes(d.code) ? "#000" : "#666")
                .attr("font-weight", d => selectedCountries.includes(d.code) ? "bold" : "normal")
                .text(d => d.name);
            
            barG.selectAll(".bar-value")
                .data(filtered, d => d.code)
                .enter()
                .append("text")
                .attr("class", "bar-value")
                .attr("x", d => barXScale(d.value) + 3)
                .attr("y", d => barYScale(d.name) + barYScale.bandwidth() / 2)
                .attr("dominant-baseline", "middle")
                .attr("font-size", "10px")
                .attr("fill", "#333")
                .text(d => {
                    if (d.value >= 1000000) return (d.value / 1000000).toFixed(1) + "M";
                    if (d.value >= 1000) return (d.value / 1000).toFixed(0) + "K";
                    return d.value.toFixed(1);
                });
        }

        function handleMouseOver(event, d) {
            const countryName = d.properties.name;
            const hmdCode = countryToHmd[countryName];
            const config = datasetConfig[currentDataset];
            
            hoveredCountry = {name: countryName, hmdCode: hmdCode, element: this};
            
            if (hmdCode && mortalityData[currentYear] && mortalityData[currentYear][hmdCode]) {
                const value = mortalityData[currentYear][hmdCode];
                
                let displayValue;
                if (value >= 1000000) {
                    displayValue = (value / 1000000).toFixed(2) + " million";
                } else if (value >= 1000) {
                    displayValue = (value / 1000).toFixed(1) + " thousand";
                } else {
                    displayValue = value.toFixed(2);
                }
                
                tooltip
                    .style("display", "block")
                    .html("<strong>" + countryName + "</strong><br>" + 
                        config.label + ": " + displayValue + " " + config.unit + "<br>" +
                        "Year: " + currentYear + "<br><em>Click to add to chart</em>");
                
                d3.select(this).attr("stroke", "#000").attr("stroke-width", 1);
            }
        }

        function handleMouseMove(event) {
            tooltip
                .style("left", (event.pageX + 10) + "px")
                .style("top", (event.pageY - 28) + "px");
        }

        function handleMouseOut() {
            hoveredCountry = null;
            tooltip.style("display", "none");
            d3.select(this).attr("stroke", "#fff").attr("stroke-width", 1);
        }

        function updateTooltip() {
            if (!hoveredCountry) return;
            
            const countryName = hoveredCountry.name;
            const hmdCode = hoveredCountry.hmdCode;
            const config = datasetConfig[currentDataset];
            
            if (hmdCode && mortalityData[currentYear] && mortalityData[currentYear][hmdCode]) {
                const value = mortalityData[currentYear][hmdCode];
                
                let displayValue;
                if (value >= 1000000) {
                    displayValue = (value / 1000000).toFixed(2) + " million";
                } else if (value >= 1000) {
                    displayValue = (value / 1000).toFixed(1) + " thousand";
                } else {
                    displayValue = value.toFixed(2);
                }
                
                tooltip
                    .html("<strong>" + countryName + "</strong><br>" + 
                        config.label + ": " + displayValue + " " + config.unit + "<br>" +
                        "Year: " + currentYear + "<br><em>Click to add to chart</em>");
            }
        }
        function updateTitles() {
            const config = datasetConfig[currentDataset];
            const genderText = currentGender !== "Total" ? " (" + currentGender + ")" : "";
            const ageText = ageFilterEnabled ? " - Age " + currentAge : "";
                    
            d3.select("#map-title").text("World Map - " + config.label + genderText + ageText + " (" + currentYear + ")");
            d3.select("#bar-title").text("Country Rankings - " + config.label + genderText + ageText);
                    
            const selectedText = selectedCountries.length > 0 
                ? selectedCountries.map(c => hmdToCountry[c]).join(", ")
                : "Click countries on map or bar chart to compare";
            d3.select("#line-title").text("Trend Comparison - " + selectedText);
        }
        function handleClick(event, d) {
            const countryName = d.properties.name;
            const hmdCode = countryToHmd[countryName];
            
            if (hmdCode && mortalityData[currentYear] && mortalityData[currentYear][hmdCode]) {
                const index = selectedCountries.indexOf(hmdCode);
                if (index > -1) {
                    selectedCountries.splice(index, 1); 
                } else {
                    selectedCountries.push(hmdCode); 
                }
                console.log("Selected:", selectedCountries);
                updateChart();
                updateBarChart();
                updateTitles();
            }
        }

        d3.select("#year-slider").on("input", function() {
            currentYear = +this.value;
            d3.select("#year-display").text(currentYear);
            updateMap();
            updateBarChart();
            updateTitles();
        });

        d3.select("#dataset-select").on("change", function() {
            currentDataset = this.value;
            loadData(currentDataset);
        });

        d3.select("#gender-select").on("change", function() {
            currentGender = this.value;
            loadData(currentDataset);
        });

        d3.select("#age-toggle").on("change", function() {
            ageFilterEnabled = this.checked;
            const ageSlider = document.getElementById("age-slider");
            const ageDisplay = document.getElementById("age-display");
            
            if (ageFilterEnabled && currentDataset !== "E0coh.txt") {
                ageSlider.disabled = false;
                currentAge = ageSlider.value;
                ageDisplay.textContent = "Age " + currentAge;
            } else {
                ageSlider.disabled = true;
                currentAge = "all";
                ageDisplay.textContent = "All Ages";
            }
            loadData(currentDataset);
        });

        d3.select("#age-slider").on("input", function() {
            currentAge = this.value;
            d3.select("#age-display").text("Age " + currentAge);
            loadData(currentDataset);
        });

        d3.select("#reset-btn").on("click", function() {
            selectedCountries = [];
            updateChart();
            updateTitles();
        });

        d3.select("#play-btn").on("click", function() {
            if (isPlaying) {
                isPlaying = false;
                clearInterval(playInterval);
                d3.select("#play-btn").text("▶ Play");
            } else {
                isPlaying = true;
                d3.select("#play-btn").text("⏸ Pause");
                
                const slider = document.getElementById("year-slider");
                const minYear = +slider.min;
                const maxYear = +slider.max;
                
                if (currentYear >= maxYear) {
                    currentYear = minYear;
                    slider.value = currentYear;
                    d3.select("#year-display").text(currentYear);
                    updateMap();
                    updateBarChart();
                    updateTitles();
                }
                
                playInterval = setInterval(function() {
                    currentYear++;
                    if (currentYear > maxYear) {
                        currentYear = maxYear;
                        isPlaying = false;
                        clearInterval(playInterval);
                        d3.select("#play-btn").text("▶ Play");
                        return;
                    }
                    slider.value = currentYear;
                    d3.select("#year-display").text(currentYear);
                    updateMap();
                    updateTooltip();
                    updateBarChart();
                    updateTitles();
                }, 200);
            }
        });

        d3.select("#bar-filter").on("change", function() {
            barFilter = this.value;
            updateBarChart();
        });

        d3.select("#zoom-in").on("click", function() {
            svg.transition().call(zoom.scaleBy, 1.5);
        });

        d3.select("#zoom-out").on("click", function() {
            svg.transition().call(zoom.scaleBy, 0.67);
        });

        d3.select("#zoom-reset").on("click", function() {
            svg.transition().call(zoom.transform, d3.zoomIdentity);
        });
    </script>
</body>
</html>
