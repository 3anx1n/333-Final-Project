<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Human Mortality Visualization</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://d3js.org/topojson.v3.min.js"></script>
</head>
<body>
    <h1>Human Mortality Database - Life Expectancy</h1>
    
    <div id="controls">
        <label>Year: </label>
        <input type="range" id="year-slider" min="1960" max="2020" value="2000">
        <span id="year-display">2000</span>
    </div>
    
    <div id="map"></div>
    <div id="tooltip"></div>
    
    <script>
        const width = 960;
        const height = 500;

        const hmdToCountry = {
            'AUS': 'Australia',
            'AUT': 'Austria',
            'BEL': 'Belgium',
            'BGR': 'Bulgaria',
            'BLR': 'Belarus',
            'CAN': 'Canada',
            'CHE': 'Switzerland',
            'CHL': 'Chile',
            'CZE': 'Czechia',
            'DEUTNP': 'Germany',
            'DNK': 'Denmark',
            'ESP': 'Spain',
            'EST': 'Estonia',
            'FIN': 'Finland',
            'FRATNP': 'France',
            'GBR_NP': 'United Kingdom',
            'GRC': 'Greece',
            'HKG': 'Hong Kong',
            'HRV': 'Croatia',
            'HUN': 'Hungary',
            'IRL': 'Ireland',
            'ISL': 'Iceland',
            'ISR': 'Israel',
            'ITA': 'Italy',
            'JPN': 'Japan',
            'KOR': 'South Korea',
            'LTU': 'Lithuania',
            'LUX': 'Luxembourg',
            'LVA': 'Latvia',
            'NLD': 'Netherlands',
            'NOR': 'Norway',
            'NZL_NP': 'New Zealand',
            'POL': 'Poland',
            'PRT': 'Portugal',
            'RUS': 'Russia',
            'SVK': 'Slovakia',
            'SVN': 'Slovenia',
            'SWE': 'Sweden',
            'TWN': 'Taiwan',
            'UKR': 'Ukraine',
            'USA': 'United States of America'
        };

        const countryToHmd = {};
        for (const [hmd, country] of Object.entries(hmdToCountry)) {
            countryToHmd[country] = hmd;
        }

        let mortalityData = {};
        let currentYear = 2000;

        const svg = d3.select("#map")
            .append("svg")
            .attr("width", width)
            .attr("height", height);

        const projection = d3.geoNaturalEarth1()
            .scale(170)
            .translate([width / 2, height / 2]);

        const path = d3.geoPath().projection(projection);

        d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json")
            .then(function(world) {
                const countries = topojson.feature(world, world.objects.countries);
                
                svg.selectAll("path")
                    .data(countries.features)
                    .enter()
                    .append("path")
                    .attr("d", path)
                    .attr("fill", "#ccc")
                    .attr("stroke", "#fff");
                
                console.log("Map loaded!");
                
                loadData();
            });

        function loadData() {
            d3.text("E0coh.txt").then(function(text) {
                const lines = text.trim().split("\n");
                
                for (let i = 1; i < lines.length; i++) {
                    const parts = lines[i].trim().split(/\s+/);
                    const popName = parts[0];
                    const year = +parts[1];
                    const total = +parts[4];
                    
                    if (hmdToCountry[popName]) {
                        if (!mortalityData[year]) {
                            mortalityData[year] = {};
                        }
                        mortalityData[year][popName] = total;
                    }
                }
                
                console.log("Data loaded!", mortalityData);
                console.log("Sample year 2000:", mortalityData[2000]);
            });
        }
    </script>
</body>
</html>
